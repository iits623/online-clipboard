<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کلیپ بورد آنلاین purple flower</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.ico" />
    <link rel="stylesheet" href="./assets/CSS/style.css" />
    <link rel="stylesheet" href="./assets/CSS/persian-datepicker.min.css" />
  </head>
  <body>
    <div class="bg-blur"></div>
    <div class="bg-gradient"></div>

    <div class="container">
      <header>
        <div class="logo">
          <p>کلیپ بورد آنلاین purple flower</p>
        </div>
        <p class="tagline">متن خود را بنویس، لینک بگیر، به اشتراک بگذار</p>
      </header>

      <main>
        <div class="input-wrapper">
          <div class="toolbar">
            <button
              type="button"
              class="tool-btn"
              id="clearBtn"
              title="پاک کردن"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M3 6h18" />
                <path
                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                />
                <line x1="10" y1="11" x2="10" y2="17" />
                <line x1="14" y1="11" x2="14" y2="17" />
              </svg>
            </button>
            <div class="tool-spacer"></div>
          </div>
          <textarea
            id="pasteContent"
            placeholder="متن خود را اینجا بنویسید..."
            rows="12"
          ></textarea>
        </div>

        <div class="options-panel">
          <div class="option-item">
            <div class="expire-group">
              <div class="expire-row">
                <span class="expire-separator">تاریخ</span>
                <input
                  type="text"
                  id="expireDate"
                  class="date-input"
                  placeholder="انتخاب تاریخ"
                  readonly
                />
                <span class="expire-separator">ساعت</span>
                <input type="time" id="expireTime" class="time-input" />
              </div>
              <small class="expire-hint" id="expireHint"
                >برای فعال کردن انقضا، هم تاریخ و هم ساعت را وارد کنید.</small
              >
            </div>
          </div>

          <div class="option-item" style="height: 100%">
            <div class="expire-group">
              <div class="expire-row">
                <span class="expire-separator">تعداد بازدید</span>
                <input
                  type="number"
                  id="maxViews"
                  class="number-input"
                  placeholder="مثال: ۱۰۰"
                  min="1"
                  max="1000"
                />
              </div>
              <small class="expire-hint"></small>
            </div>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn-outline" id="saveBtn">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
              />
              <polyline points="17 21 17 13 7 13 7 21" />
              <polyline points="7 3 7 8 15 8" />
            </svg>
            ایجاد پیست
          </button>
          <a href="./view.html" class="btn-outline">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            مشاهده پیست
          </a>
        </div>

        <div class="result-card" id="resultArea" style="display: none">
          <div class="result-icon">
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          </div>
          <h3>پیست شما ساخته شد!</h3>
          <div class="link-container">
            <input type="text" id="shareLink" readonly />
            <button class="copy-link-btn" id="copyLinkBtn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                <path
                  d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                />
              </svg>
              کپی لینک
            </button>
          </div>
        </div>
      </main>

      <footer>
        <p class="footer-text">
          ساخته شده با <span>💜</span> توسط
          <a href="https://pentify.ir/" target="_blank" class="footer-link"
            >آکادمی پنتیفای</a
          >
        </p>
      </footer>
    </div>

    <script src="./assets/JS/jquery.min.js"></script>
    <script src="./assets/JS/persian-date.min.js"></script>
    <script src="./assets/JS/persian-datepicker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/JS/script.js"></script>
  </body>
</html>
